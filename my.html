<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Hero Replica</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=Sacramento&display=swap"
      rel="stylesheet"
    />

    <style>
      /* 1. RESET */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #f0f5ff;
        font-family: "Inter", sans-serif;
        min-height: 200vh; /* Allows scrolling to test effect */
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
      }

      /* --- HEADER STYLES --- */
      .glass-header {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 95%;
        max-width: 1400px; /* Wider to fit logo/btn */
        padding: 15px 30px;
        z-index: 1000;
        transition: all 0.4s ease;

        /* Flex Layout for Logo - Nav - Button */
        display: flex;
        align-items: center;
        justify-content: space-between;

        /* Initial State */
        background: transparent;
        border-radius: 0;
      }

      /* 1. LOGO STYLE */
      .logo {
        font-family: "poppins", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #0e1b25;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        flex: 1; /* Pushes nav to center */
      }

      /* 2. NAVIGATION */
      nav {
        flex: 2; /* Takes up center space */
        display: flex;
        justify-content: right;
      }

      .nav-list {
        display: flex;
        justify-content: center;
        gap: 30px;
        list-style: none;
        margin-right: -150px;
        padding: 0;
      }

      .nav-list li a {
        text-decoration: none;
        color: #0e1b25;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: color 0.3s ease;
      }

      .nav-list li a:hover {
        color: #007bff;
      }

      /* 3. BUTTON STYLE */
      .btn-container {
        flex: 1; /* Pushes button to right end */
        display: flex;
        justify-content: flex-end;
      }

      .nav-btn {
        background-color: #0e1b25;
        color: #fff;
        padding: 10px 25px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }

      .nav-btn:hover {
        background-color: transparent;
        color: #0e1b25;
        border: 2px solid #0e1b25;
        transform: scale(1.05);
      }

      /* --- SCROLLED STATE (Glassmorphism + Pill Shape) --- */
      .glass-header.scrolled {
        top: 20px;
        border-radius: 50px;
        width: 100%; /* Shrinks slightly */
        max-width: 1200px; /* Contains content closer */

        /* Glass Effect */
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
      }

      /* Mobile Adjustments */
      @media (max-width: 900px) {
        .nav-list {
          display: none;
        } /* Hide menu text on mobile */
        .glass-header {
          justify-content: space-between;
        }
        .logo {
          font-size: 1.5rem;
        }
      }

      /* --- HERO SECTION STYLES (Unchanged) --- */
      .grid-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image:
          linear-gradient(rgba(0, 100, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 100, 255, 0.05) 1px, transparent 1px);
        background-size: 80px 80px;
        background:
          radial-gradient(circle, transparent 20%, #f0f5ff 100%),
          linear-gradient(rgba(0, 123, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 123, 255, 0.03) 1px, transparent 1px);
        background-size:
          100% 100%,
          60px 60px,
          60px 60px;
      }

      .hero-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 1600px;
        padding: 0 20px;
        position: relative;
        margin-top: 15vh;
      }

      .content-wrapper {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        position: relative;
      }

      .giant-text {
        font-family: "Anton", sans-serif;
        font-size: clamp(5rem, 18vw, 14rem);
        line-height: 0.8;
        color: #000000;
        text-transform: uppercase;
        letter-spacing: -5px;
        position: relative;
        z-index: 1;
        margin: 0px -60px;
      }

      .text-group-left,
      .text-group-right {
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .text-group-left {
        align-items: flex-start;
      }
      .text-group-right {
        align-items: flex-end;
      }

      .signature {
        font-family: "Sacramento", cursive;
        font-size: clamp(2rem, 3.5vw, 4rem);
        color: #1a1a1a;
        position: absolute;
        top: -80px;
        left: 5px;
        transform: rotate(-10deg);
        z-index: 3;
      }

      .label-top {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: clamp(0.7rem, 1vw, 1rem);
        color: #0e1b25;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        margin-right: 5px;
      }

      .avatar-container {
        position: relative;
        z-index: 2;
        margin: 0 -4%;
        margin-bottom: -20px;
        display: flex;
        align-items: flex-end;
      }

      .avatar-container img {
        width: clamp(220px, 25vw, 500px);
        height: auto;
      }

      .blue-line {
        height: 8px;
        background-color: #000000;
        width: 100px;
        flex-grow: 1;
        margin-top: 180px;
      }

      @media (max-width: 900px) {
        .content-wrapper {
          flex-direction: column;
          align-items: center;
        }
        .avatar-container {
          order: -1;
          margin: 0 0 20px 0;
        }
        .blue-line {
          display: none;
        }
        .signature {
          top: -40px;
          left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="glass-header" id="navbar">
      <div class="logo">Mufeed</div>

      <nav>
        <ul class="nav-list">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Experience</a></li>
          <li><a href="#">Project</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>

      <div class="btn-container">
        <a href="#" class="nav-btn">Let's Talk</a>
      </div>
    </header>

    <div class="grid-background"></div>

    <section class="hero-container">
      <div class="blue-line line-left"></div>

      <div class="content-wrapper">
        <div class="text-group-left">
          <span class="signature">Mufeed</span>
          <h1 class="giant-text">PORT</h1>
        </div>

        <div class="avatar-container">
          <img
            src="homepage/pngtree-3d-character-pointing-to-right-pose-png-image_9190016.png"
            alt="3D Portfolio Character"
          />
        </div>

        <div class="text-group-right">
          <span class="label-top">WEB DEVELOPER</span>
          <h1 class="giant-text">FOLIO</h1>
        </div>
      </div>

      <div class="blue-line line-right"></div>
    </section>

    <script>
      window.addEventListener("scroll", function () {
        var header = document.querySelector("#navbar");
        if (window.scrollY > 50) {
          header.classList.add("scrolled");
        } else {
          header.classList.remove("scrolled");
        }
      });
    </script>
  </body>
</html>
